const ids=["welcome","intro","book","bookText","openBook","network","networkText"];
function translatePage(){
 const lang=document.getElementById("language").value;
 const words=translations[lang] || translations.en;
 ids.forEach((id,i)=>document.getElementById(id).textContent=words[i]);
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 try{localStorage.setItem("cemani-language",lang)}catch(e){}
}
(function initLanguage(){
 const picker=document.getElementById("language");
 let saved="";
 try{saved=localStorage.getItem("cemani-language")||""}catch(e){}
 const browser=(navigator.languages||[navigator.language||"en"]);
 const matched=browser.map(x=>x.toLowerCase()).map(x=>{
  if(x.startsWith("sr-cyrl"))return "sr-Cyrl";
  if(x.startsWith("sr"))return "sr-Latn";
  if(x.startsWith("zh"))return "zh";
  return x.split("-")[0];
 }).find(x=>translations[x]);
 picker.value=translations[saved]?saved:(matched||"en");
 translatePage();
})();
</script>
